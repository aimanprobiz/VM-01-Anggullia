  <div class="mobile-container">

    <!-- Detail Card Wrapper -->

      <!-- Inner Content Padding Block -->

        <!-- 2. Business Title & Subtitle -->

      </div>

    <!-- POPUP MODAL FOR CASHIER PIN REDEMPTION -->
    <dialog id="redeemModal" style="background: var(--card-bg); color: var(--text-main); border: 1.5px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; width: 90%; max-width: 360px; box-shadow: var(--shadow-md); position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0;">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="font-size: 1rem; font-weight: 700; color: var(--primary-color);">Cashier Redemption</h3>
          <button type="button" class="closeModalBtn" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); padding: 4px;">&times;</button>
        </div>

        <p style="font-size: 0.82rem; color: var(--text-muted); line-height: 1.4;">
          Please present your screen to the cashier and request the 4-digit PIN to confirm redemption:
        </p>

        <input type="password" id="cashierPin" maxlength="4" readonly placeholder="••••" class="pin-input" style="width: 100%; padding: 10px; font-size: 1.4rem; text-align: center; letter-spacing: 8px; border-radius: 8px; border: 1.5px solid var(--border-color); background-color: #faf9f5; outline: none;">

        <!-- Custom On-Screen Number Pad Grid -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px;">

          <button type="button" class="key-btn" data-num="2" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">2</button>
          <button type="button" class="key-btn" data-num="3" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">3</button>
          <button type="button" class="key-btn" data-num="4" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">4</button>
          <button type="button" class="key-btn" data-num="5" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">5</button>
          <button type="button" class="key-btn" data-num="6" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">6</button>
          <button type="button" class="key-btn" data-num="7" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">7</button>
          <button type="button" class="key-btn" data-num="8" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">8</button>
          <button type="button" class="key-btn" data-num="9" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">9</button>
          <button type="button" id="keyClear" style="padding: 12px; font-size: 0.85rem; font-weight: 600; background: #f2dede; color: #a94442; border: 1.5px solid #ebccd1; border-radius: 6px; cursor: pointer;">Clear</button>
          <button type="button" class="key-btn" data-num="0" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">0</button>
          <button type="button" id="keyDelete" style="padding: 12px; font-size: 0.85rem; font-weight: 600; background: #e2e8f0; color: #334155; border: 1.5px solid #cbd5e1; border-radius: 6px; cursor: pointer;">⌫</button>
        </div>

        <button id="verifyPinBtn" class="action-btn" style="width: 100%; margin-top: 4px;">Confirm PIN</button>

<!-- Minimalist White Toast Notification (CTA Scroll) -->
<div id="ctaToast" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.92); background: #ffffff; color: #000000; padding: 12px 20px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; border: 1px solid var(--border-color); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18); display: flex; align-items: center; gap: 6px; opacity: 0; pointer-events: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); z-index: 9999; white-space: nowrap;">
  <span style="letter-spacing: -0.01em;">Tap the button to claim this deal!</span>
</div>
    
<!-- Social/Website Toast Notification (Missing Links) -->
<div id="socialToast" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.92); background: #ffffff; color: #000000; padding: 12px 20px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; border: 1px solid var(--border-color); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18); display: flex; align-items: center; gap: 6px; opacity: 0; pointer-events: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); z-index: 9999; white-space: nowrap;">
  <span id="socialToastMsg" style="letter-spacing: -0.01em;"></span>
</div>
    
  </div>

<script>
    async function loadBusinessDetail() {
      const params = new URLSearchParams(window.location.search);
      const rawSlug = params.get('slug');

      const setVal = (id, property, value) => {
        const el = document.getElementById(id);
        if (el) el[property] = value;
      };

// --- Interactive Deal Box Toast & 2.8s Scroll Prompt ---
const dealBox = document.getElementById('dealBox');
const ctaToast = document.getElementById('ctaToast');

if (dealBox) {
  dealBox.style.cursor = 'pointer';

  dealBox.addEventListener('click', () => {
    // 1. Find the currently visible main CTA button
    const activeCta = document.querySelector('#redemptionArea button[style*="flex"], #redemptionArea a[style*="flex"]');

    if (activeCta) {
      // 2. Smoothly scroll the CTA button into view
      activeCta.scrollIntoView({ behavior: 'smooth', block: 'center' });

      // 3. Trigger 2.8s pulse animation
      activeCta.classList.remove('cta-pulse-active');
      void activeCta.offsetWidth; // Force CSS reflow to re-trigger animation if clicked twice
      activeCta.classList.add('cta-pulse-active');

      // Remove the class after exactly 2.8 seconds
      setTimeout(() => {
        activeCta.classList.remove('cta-pulse-active');
      }, 2800);
    }

    // 4. Trigger the white minimalist floating toast for 2.8 seconds
    if (ctaToast) {
      ctaToast.style.opacity = '1';
      ctaToast.style.transform = 'translate(-50%, -50%) scale(1)';

      // Auto-hide toast after 2.8 seconds
      setTimeout(() => {
        ctaToast.style.opacity = '0';
        ctaToast.style.transform = 'translate(-50%, -50%) scale(0.92)';
      }, 2800);
    }
  });
}
      
      // --- Copy Link Logic ---
      const copyLinkBtn = document.getElementById('copyLinkBtn');
      if (copyLinkBtn) {
        copyLinkBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(window.location.href);
            alert('✓ Profile link copied!');
          } catch (err) {
            alert('Copy link: ' + window.location.href);
          }
        });
      }

      // --- Native Share Logic ---
      const shareBtn = document.getElementById('shareBtn');
      if (shareBtn) {
        shareBtn.addEventListener('click', async () => {
          const bizNameEl = document.getElementById('bizName');
          const bizDealEl = document.getElementById('bizDeal');
          
          const currentTitle = bizNameEl && bizNameEl.textContent ? bizNameEl.textContent : 'DailyBarakah SG';
          const currentDeal = bizDealEl && bizDealEl.textContent ? bizDealEl.textContent : 'Community Special Deal';

          const shareData = {
            title: `${currentTitle} - DailyBarakah SG`,
            text: `Check out *${currentTitle}* on DailyBarakah SG! Special Deal: "${currentDeal}"`,
            url: window.location.href
          };

          if (navigator.share) {
            try {
              await navigator.share(shareData);
            } catch (err) {
              // User cancelled share
            }
          } else if (copyLinkBtn) {
            copyLinkBtn.click();
          }
        });
      }

      if (!rawSlug) {
        setVal('bizName', 'textContent', 'Business not found.');
        return;
      }

      const slug = rawSlug.trim().toLowerCase();

      try {
        const response = await fetch('/api/businesses');
        const businesses = await response.json();

        const biz = businesses.find(b => {
          const bSlug = (b.Slug || b.slug || '').trim().toLowerCase();
          const generatedSlug = (b.Name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
          return bSlug === slug || generatedSlug === slug;
        });

        if (!biz) {
          setVal('bizName', 'textContent', 'Business listing not found.');
          return;
        }

        const bizName = biz.Name || biz.name || 'Business Details';
        const bizSub = biz.SubTitle || biz.subtitle || '';
        const bizDealText = biz.Deal || biz.deal || '';
        const bizDesc = biz.Description || biz.description || '';
        const bizImage = biz.ImageURL || biz.ImageUrl || biz.imageurl || biz.Image || biz.image || 'https://lh3.googleusercontent.com/d/1MBk6pIwDCG0NH9bh9lD7EY9kAp4IQiNM';
        
        const defaultSlug = bizName.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        const bizSlugVal = biz.Slug || biz.slug || defaultSlug;

        document.title = `${bizName} - DailyBarakah SG`;
        
        const nameEl = document.getElementById('bizName');
        nameEl.textContent = bizName;
        nameEl.classList.remove('skeleton-line', 'title');
        nameEl.style.minHeight = 'auto';

        const subEl = document.getElementById('bizSub');
        subEl.textContent = bizSub;
        subEl.classList.remove('skeleton-line', 'sub');
        subEl.style.minHeight = 'auto';

        // --- UPDATED TICKET LOGIC FOR MISSING DEALS ---
        const dealEl = document.getElementById('bizDeal');
        const dealBox = document.getElementById('dealBox');
        const couponTagEl = dealBox ? dealBox.querySelector('.coupon-tag') : null;

        if (dealBox) {
          dealBox.style.display = 'block';
          
          if (bizDealText) {
            if (couponTagEl) couponTagEl.textContent = 'UMMAH SPECIAL:';
            dealEl.textContent = bizDealText;
            dealBox.style.background = 'linear-gradient(135deg, #fffdf2 0%, #fef5d9 100%)';
            dealBox.style.borderColor = 'var(--accent-gold, #c29a38)';
          } else {
            if (couponTagEl) couponTagEl.textContent = 'COMMUNITY DIRECTORY:';
            dealEl.textContent = 'Supported Local Business';
            dealBox.style.background = 'rgba(15, 56, 44, 0.03)';
            dealBox.style.borderColor = 'var(--border-color)';
          }
        }

        const descEl = document.getElementById('bizDescription');
        descEl.textContent = bizDesc;
        descEl.style.display = 'block';
        const descSkeleton = document.getElementById('descSkeleton');
        if (descSkeleton) descSkeleton.style.display = 'none';

        const bannerImg = document.getElementById('bizBanner');
        const bannerSkeleton = document.getElementById('bizBannerSkeleton');
        if (bannerImg) {
          bannerImg.src = bizImage;
          bannerImg.style.display = 'block';
          if (bannerSkeleton) bannerSkeleton.style.display = 'none';
        }

        const openRedeemModalBtn = document.getElementById('openRedeemModalBtn');
        const openCodeModalBtn = document.getElementById('openCodeModalBtn');
        const whatsappBtn = document.getElementById('whatsappBtn');
        const redemptionArea = document.getElementById('redemptionArea');

        // Hide all active buttons by default
        if (openRedeemModalBtn) openRedeemModalBtn.style.display = 'none';
        if (openCodeModalBtn) openCodeModalBtn.style.display = 'none';
        if (whatsappBtn) whatsappBtn.style.display = 'none';
        
        const actionType = (biz.ActionType || biz.actiontype || '').toLowerCase().trim();

        if (actionType === 'claim') {
          if (openRedeemModalBtn) openRedeemModalBtn.style.display = 'flex';

        } else if (actionType === 'code' || actionType === 'promocode') {
          if (openCodeModalBtn) {
            openCodeModalBtn.style.display = 'flex';

            openCodeModalBtn.addEventListener('click', () => {
              const promoCode = biz.PromoCode || biz.promocode || biz.promoCode || 'D.BARAKAHSG';
              const storeUrl = biz.WebsiteURL || biz.websiteurl || biz.WebsiteUrl || '#';

              const userChoice = confirm(`Exclusive Code for ${bizName}:\n\n👉 ${promoCode}\n\nClick OK to copy the code and visit their store!`);

              if (userChoice) {
                navigator.clipboard.writeText(promoCode);

                fetch('/api/redeem', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ slug: bizSlugVal, action: 'copy' })
                }).catch(() => {});

                if (storeUrl && storeUrl !== '#') {
                  window.open(storeUrl, '_blank');
                }
              }
            });
          }

        } else if (actionType === 'whatsapp' || biz.Phone || biz.phone) {
          if (whatsappBtn) {
            whatsappBtn.style.display = 'flex';
            const refCode = `DB-${bizSlugVal.toUpperCase()}`;
            const rawMessage = `Assalaamualaikum! I came across ${bizName} on DailyBarakah SG (Ref: ${refCode}) and would love to claim the Ummah Special: "${bizDealText}". Let me know how to proceed, jazakallahu khair!`;
            const phoneNum = biz.Phone || biz.phone || '';
            const whatsappUrl = `https://wa.me/${phoneNum}?text=${encodeURIComponent(rawMessage)}`;
            
            whatsappBtn.href = whatsappUrl;

            whatsappBtn.addEventListener('click', (e) => {
              e.preventDefault();

              const trackingPayload = JSON.stringify({ slug: bizSlugVal, action: 'whatsapp' });

              if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/redeem', new Blob([trackingPayload], { type: 'application/json' }));
              } else {
                fetch('/api/redeem', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: trackingPayload,
                  keepalive: true
                }).catch(() => {});
              }

              window.location.href = whatsappUrl;
            });
          }
        } else {
          // --- NO PROMO METHOD FALLBACK (DIM BUTTON) ---
          if (redemptionArea) {
            redemptionArea.innerHTML = `
              <div class="action-btn-dim">
                No Active Digital Offer — Visit Links Below ↗
              </div>
            `;
          }
        }

        const redeemModal = document.getElementById('redeemModal');
        const cashierPinInput = document.getElementById('cashierPin');
        let currentPin = '';

        function resetModalState() {
          currentPin = '';
          if (cashierPinInput) cashierPinInput.value = '';
        }

        document.querySelectorAll('.key-btn').forEach(button => {
          button.addEventListener('click', () => {
            if (currentPin.length < 4) {
              currentPin += button.getAttribute('data-num');
              if (cashierPinInput) cashierPinInput.value = currentPin;
            }
          });
        });

        const keyClear = document.getElementById('keyClear');
        if (keyClear) keyClear.addEventListener('click', resetModalState);

        const keyDelete = document.getElementById('keyDelete');
        if (keyDelete) {
          keyDelete.addEventListener('click', () => {
            currentPin = currentPin.slice(0, -1);
            if (cashierPinInput) cashierPinInput.value = currentPin;
          });
        }

        if (openRedeemModalBtn && redeemModal) {
          openRedeemModalBtn.addEventListener('click', () => {
            resetModalState();
            redeemModal.showModal();
          });
        }

        document.querySelectorAll('.closeModalBtn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (redeemModal) redeemModal.close();
            resetModalState();
          });
        });

        const verifyPinBtn = document.getElementById('verifyPinBtn');
        if (verifyPinBtn) {
          verifyPinBtn.addEventListener('click', async () => {
            const targetPin = String(biz.PIN || biz.pin || '1234').trim();

            if (currentPin === targetPin) {
              if (redeemModal) redeemModal.close();
              resetModalState();

              const trackingPayload = JSON.stringify({ slug: bizSlugVal, action: 'claim' });
              
              if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/redeem', new Blob([trackingPayload], { type: 'application/json' }));
              } else {
                fetch('/api/redeem', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: trackingPayload,
                  keepalive: true
                }).catch(() => {});
              }

              alert(`✓ Successfully Redeemed!\n\nVoucher validated for ${bizName}.\n\nMay your transaction be filled with Barakah!`);

            } else {
              alert('Incorrect PIN. Please enter the correct 4-digit cashier PIN.');
              resetModalState();
            }
          });
        }

        if (redeemModal) {
          redeemModal.addEventListener('click', (event) => {
            const rect = redeemModal.getBoundingClientRect();
            if (
              event.clientX < rect.left ||
              event.clientX > rect.right ||
              event.clientY < rect.top ||
              event.clientY > rect.bottom
            ) {
              redeemModal.close();
              resetModalState();
            }
          });
        }

        // --- Social Media & Website Links Logic with Toast Fallback ---
        const webUrl = biz.WebsiteURL || biz.websiteurl || biz.WebsiteUrl || '';
        const igUrl = biz.InstagramURL || biz.instagramurl || biz.Instagram || '';
        const tiktokUrl = biz.TikTokURL || biz.tiktokurl || biz.TikTok || '';
        const phoneNum = biz.Phone || biz.phone || '';

        const socialToast = document.getElementById('socialToast');
        const socialToastMsg = document.getElementById('socialToastMsg');
        let socialToastTimeout = null;

        function showSocialToast(message) {
          if (!socialToast || !socialToastMsg) return;
          
          socialToastMsg.textContent = message;
          socialToast.style.opacity = '1';
          socialToast.style.transform = 'translate(-50%, -50%) scale(1)';

          if (socialToastTimeout) clearTimeout(socialToastTimeout);

          socialToastTimeout = setTimeout(() => {
            socialToast.style.opacity = '0';
            socialToast.style.transform = 'translate(-50%, -50%) scale(0.92)';
          }, 2500);
        }

        function setupLinkButton(btnId, targetUrl, platformName) {
          const btn = document.getElementById(btnId);
          if (!btn) return;

          if (targetUrl) {
            btn.href = targetUrl.startsWith('http') ? targetUrl : `https://${targetUrl}`;
            btn.style.opacity = '1';
          } else {
            btn.href = 'javascript:void(0)';
            btn.removeAttribute('target'); 
            btn.style.opacity = '0.5'; 

            btn.addEventListener('click', (e) => {
              e.preventDefault();
              showSocialToast(`No ${platformName} link available for this business`);
            });
          }
        }

        setupLinkButton('socialWebsite', webUrl, 'website');
        setupLinkButton('socialInstagram', igUrl, 'Instagram');
        setupLinkButton('socialTiktok', tiktokUrl, 'TikTok');
        setupLinkButton('socialWhatsapp', phoneNum ? `https://wa.me/${phoneNum}` : '', 'WhatsApp');
      } catch (error) {
        console.error('Error loading business details:', error);
      }
    }

    loadBusinessDetail();
  </script>
</body>
</html>
