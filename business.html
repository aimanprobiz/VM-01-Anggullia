<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Details - DailyBarakah SG</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div class="mobile-container">
    <a href="/" style="font-size: 0.85rem; color: var(--primary-color); text-decoration: none; font-weight: 600;">← Back to Directory</a>

    <div class="card" id="detailContainer" style="margin-top: 10px;">
      <!-- 1. Header: Name & Subtitle -->
      <h2 id="bizName" style="color: var(--primary-color); margin-bottom: 4px;">Loading business...</h2>
      <p id="bizSub" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;"></p>
      
      <!-- 2. Image below Subtitle -->
      <img id="bizBanner" src="" alt="Business Banner" style="width: 100%; border-radius: var(--radius-sm, 8px); display: none; margin-bottom: 15px; object-fit: cover; max-height: 220px;">

      <!-- 3. Description -->
      <p id="bizDescription" style="font-size: 0.9rem; line-height: 1.55; margin-bottom: 15px; white-space: pre-line;"></p>

      <!-- 4. Ummah Special -->
      <div id="dealBox" style="background-color: var(--accent-gold-bg, #fdf8ec); padding: 12px; border-radius: var(--radius-sm, 8px); border: 1px solid rgba(221, 186, 88, 0.4); margin-bottom: 15px;">
        <p style="font-size: 0.72rem; font-weight: 700; color: var(--primary-color); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px;">
          Ummah Special:
        </p>
        <p id="bizDeal" style="font-size: 0.95rem; font-weight: 700; color: var(--text-main);"></p>
      </div>

      <!-- 5. Main Action Area -->
      <div id="redemptionArea">
        <!-- In-store Redemption Button (Triggers Popup Modal) -->
        <button id="openRedeemModalBtn" class="action-btn" style="display: none; width: 100%;">
          Redeem In-Store Voucher 🎟️
        </button>

        <!-- WhatsApp Redirect Button -->
        <a id="whatsappBtn" href="#" target="_blank" rel="noopener noreferrer" class="action-btn" style="display: none; text-align: center; text-decoration: none; width: 100%;">
          Message Vendor on WhatsApp 💬
        </a>
      </div>
    </div>

    <!-- POPUP MODAL FOR CASHIER PIN REDEMPTION -->
    <dialog id="redeemModal" style="background: var(--card-bg); color: var(--text-main); border: 1.5px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; width: 90%; max-width: 360px; box-shadow: var(--shadow-md); position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0;">
      
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="font-size: 1rem; font-weight: 700; color: var(--primary-color);">Cashier Redemption</h3>
          <button type="button" class="closeModalBtn" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); padding: 4px;">&times;</button>
        </div>

        <p style="font-size: 0.82rem; color: var(--text-muted); line-height: 1.4;">
          Please present your screen to the cashier and request the 4-digit PIN to confirm redemption:
        </p>

        <!-- Custom In-App Notification Banner (Replaces alert header) -->
        <div id="pinAlertMsg" style="display: none; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-align: center; line-height: 1.4;"></div>

        <input type="password" id="cashierPin" maxlength="4" readonly placeholder="••••" class="pin-input" style="width: 100%; padding: 10px; font-size: 1.4rem; text-align: center; letter-spacing: 8px; border-radius: 8px; border: 1.5px solid var(--border-color); background-color: #faf9f5; outline: none;">

        <!-- Custom On-Screen Number Pad Grid -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px;">
          <button type="button" class="key-btn" data-num="1" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">1</button>
          <button type="button" class="key-btn" data-num="2" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">2</button>
          <button type="button" class="key-btn" data-num="3" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">3</button>
          <button type="button" class="key-btn" data-num="4" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">4</button>
          <button type="button" class="key-btn" data-num="5" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">5</button>
          <button type="button" class="key-btn" data-num="6" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">6</button>
          <button type="button" class="key-btn" data-num="7" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">7</button>
          <button type="button" class="key-btn" data-num="8" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">8</button>
          <button type="button" class="key-btn" data-num="9" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">9</button>
          <button type="button" id="keyClear" style="padding: 12px; font-size: 0.85rem; font-weight: 600; background: #f2dede; color: #a94442; border: 1.5px solid #ebccd1; border-radius: 6px; cursor: pointer;">Clear</button>
          <button type="button" class="key-btn" data-num="0" style="padding: 12px; font-size: 1.1rem; font-weight: 600; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 6px; cursor: pointer;">0</button>
          <button type="button" id="keyDelete" style="padding: 12px; font-size: 0.85rem; font-weight: 600; background: #e2e8f0; color: #334155; border: 1.5px solid #cbd5e1; border-radius: 6px; cursor: pointer;">⌫</button>
        </div>

        <button id="verifyPinBtn" class="action-btn" style="width: 100%; margin-top: 4px;">Confirm PIN</button>
      </div>
    </dialog>
  </div>

  <script>
    async function loadBusinessDetail() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        document.getElementById('bizName').textContent = "Business not found.";
        return;
      }

      try {
        const response = await fetch('/api/businesses');
        const businesses = await response.json();

        const biz = businesses.find(b => b.Slug === slug);

        if (!biz) {
          document.getElementById('bizName').textContent = "Business listing not found.";
          return;
        }

        // Set page text content
        document.title = `${biz.Name} - DailyBarakah SG`;
        document.getElementById('bizName').textContent = biz.Name;
        document.getElementById('bizSub').textContent = biz.SubTitle || '';
        document.getElementById('bizDeal').textContent = biz.Deal || 'No special deal specified.';
        document.getElementById('bizDescription').textContent = biz.Description || '';

        // Handle Image URL
        const bannerImg = document.getElementById('bizBanner');
        const defaultImg = 'https://lh3.googleusercontent.com/d/1MBk6pIwDCG0NH9bh9lD7EY9kAp4IQiNM';
        bannerImg.src = biz.ImageURL || defaultImg;
        bannerImg.style.display = 'block';

        // Action Type Setup
        const openRedeemModalBtn = document.getElementById('openRedeemModalBtn');
        const whatsappBtn = document.getElementById('whatsappBtn');
        const actionType = (biz.ActionType || '').toLowerCase();

        if (actionType === 'claim') {
          openRedeemModalBtn.style.display = 'block';
        } else {
          whatsappBtn.style.display = 'block';
          const refCode = `DB-${biz.Slug.toUpperCase()}`;
          const rawMessage = `Assalaamualaikum! I found ${biz.Name} on DailyBarakah SG [${refCode}] and would like to claim/enquire about the Ummah Special: "${biz.Deal || ''}".`;
          whatsappBtn.href = `https://wa.me/${biz.Phone || ''}?text=${encodeURIComponent(rawMessage)}`;
        }

        const redeemModal = document.getElementById('redeemModal');
        const cashierPinInput = document.getElementById('cashierPin');
        const pinAlertMsg = document.getElementById('pinAlertMsg');
        let currentPin = '';

        // Helper to display custom inline messages
        function showMessage(text, isSuccess) {
          pinAlertMsg.style.display = 'block';
          pinAlertMsg.style.backgroundColor = isSuccess ? '#e8f5e9' : '#fde8e8';
          pinAlertMsg.style.color = isSuccess ? '#2e7d32' : '#c81e1e';
          pinAlertMsg.style.border = isSuccess ? '1.5px solid #a5d6a7' : '1.5px solid #f8b4b4';
          pinAlertMsg.innerText = text;
        }

        // Helper to reset modal feedback
        function resetModalState() {
          currentPin = '';
          cashierPinInput.value = '';
          pinAlertMsg.style.display = 'none';
        }

        // Bind keypad buttons once on load
        document.querySelectorAll('.key-btn').forEach(button => {
          button.addEventListener('click', () => {
            if (currentPin.length < 4) {
              currentPin += button.getAttribute('data-num');
              cashierPinInput.value = currentPin;
            }
          });
        });

        document.getElementById('keyClear').addEventListener('click', () => {
          currentPin = '';
          cashierPinInput.value = '';
          pinAlertMsg.style.display = 'none';
        });

        document.getElementById('keyDelete').addEventListener('click', () => {
          currentPin = currentPin.slice(0, -1);
          cashierPinInput.value = currentPin;
        });

        // Open modal & reset input
        openRedeemModalBtn.addEventListener('click', () => {
          resetModalState();
          redeemModal.showModal();
        });

        // Close handlers for all elements with class 'closeModalBtn'
        document.querySelectorAll('.closeModalBtn').forEach(btn => {
          btn.addEventListener('click', () => {
            redeemModal.close();
            resetModalState();
          });
        });

        // Verify PIN logic
        document.getElementById('verifyPinBtn').addEventListener('click', async () => {
          const targetPin = String(biz.PIN || '1234').trim();

          if (currentPin === targetPin) {
            // 1. Display success message inside modal
            showMessage(`✓ Successfully Redeemed!\n\nVoucher validated for ${biz.Name}. Please show this confirmation to the cashier.`, true);

            // 2. Increment redemption count in Airtable in background
            try {
              fetch('/api/redeem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slug: biz.Slug || biz.slug })
              })
              .then(res => res.json())
              .then(data => console.log('Airtable response:', data))
              .catch(err => console.error('Fetch error:', err));
            } catch (err) {
              console.error('Error triggering redemption log:', err);
            }

            // 3. Auto-close modal after 3 seconds so cashier has time to see it
            setTimeout(() => {
              redeemModal.close();
              resetModalState();
            }, 3000);

          } else {
            // Display error message inside modal
            showMessage('Incorrect PIN. Please enter the correct 4-digit cashier PIN.', false);
            currentPin = '';
            cashierPinInput.value = '';
          }
        });

        // Close modal when clicking outside backdrop
        redeemModal.addEventListener('click', (event) => {
          const rect = redeemModal.getBoundingClientRect();
          if (
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom
          ) {
            redeemModal.close();
            resetModalState();
          }
        });

      } catch (error) {
        console.error('Error loading business details:', error);
      }
    }

    loadBusinessDetail();
  </script>
</body>
</html>
