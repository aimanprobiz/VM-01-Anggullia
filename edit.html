<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Business Listing - DailyBarakah SG</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div class="mobile-container" style="padding-bottom: 40px;">
    
    <!-- Top Nav -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <a href="/" style="font-size: 0.85rem; color: var(--primary-color); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
        ← Back to Directory
      </a>
      <button id="logoutBtn" style="background: transparent; border: none; font-size: 0.8rem; color: #dc2626; font-weight: 600; cursor: pointer; padding: 4px 8px;">
        Log Out
      </button>
    </div>

    <!-- Header Title & Polished Preview Engine -->
    <div style="text-align: center; margin-bottom: 12px;">
      <h2 style="color: var(--primary-color); font-size: 1.4rem; font-weight: 800; margin-bottom: 4px;">Vendor Dashboard</h2>
      <p style="color: var(--text-muted); font-size: 0.84rem; line-height: 1.4; margin-bottom: 12px;">
        Manage your business listing details, update Ummah deals, and edit contact links.
      </p>

      <!-- LIVE PROFILE CARD PREVIEW (Image -> Centered Name -> View Link) -->
      <div id="liveCardPreviewWrapper" style="display: none; margin-bottom: 14px; position: relative; align-items: center; justify-content: center; gap: 4px;">
        <!-- Left Arrow -->
        <button type="button" id="prevListingBtn" aria-label="Previous Listing" style="background: var(--card-bg); border: 1.5px solid var(--border-color); color: var(--primary-color); width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; shrink: 0; box-shadow: var(--shadow-sm); z-index: 2;">
          ‹
        </button>

        <!-- Profile Card Container -->
        <div style="margin: 0; width: 100%; max-width: 300px; text-align: left; border: 1.5px solid var(--border-color); border-radius: var(--radius-md); padding: 10px; background: #faf9f5; box-shadow: var(--shadow-sm);">
          <div style="position: relative; margin-bottom: 8px;">
            <img id="previewCardBanner" src="https://lh3.googleusercontent.com/d/1MBk6pIwDCG0NH9bh9lD7EY9kAp4IQiNM" alt="Profile Banner" style="width: 100%; height: auto; max-height: 140px; object-fit: cover; border-radius: var(--radius-sm); display: block;">
            <span id="previewFeaturedBadge" class="grid-featured-badge" style="display: none;" title="Featured Listing">★</span>
          </div>

          <!-- Business Name Horizontally Center Aligned -->
          <h4 id="previewCardName" style="font-size: 0.95rem; font-weight: 800; color: var(--primary-color); text-align: center; margin-bottom: 6px;">Business Name</h4>

          <!-- View Live Business Page Link -->
          <a id="previewViewLink" href="#" target="_blank" style="display: block; text-decoration: none; text-align: center; font-size: 0.74rem; padding: 6px 0; background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-weight: 700; color: var(--primary-color);">
            View Live Business Page ↗
          </a>
        </div>

        <!-- Right Arrow -->
        <button type="button" id="nextListingBtn" aria-label="Next Listing" style="background: var(--card-bg); border: 1.5px solid var(--border-color); color: var(--primary-color); width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; shrink: 0; box-shadow: var(--shadow-sm); z-index: 2;">
          ›
        </button>
      </div>

      <!-- SELECT LISTING WITH PILL-OUTLINE DROPDOWN -->
      <div id="businessSelectorContainer" style="display: none; margin-bottom: 10px; align-items: center; justify-content: center; gap: 8px;">
        <span style="font-size: 0.76rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">
          Select Listing:
        </span>
        <select id="businessSelector" style="padding: 6px 12px; font-size: 0.82rem; font-weight: 700; border: 1.5px solid var(--border-color); border-radius: 20px; background: #ffffff; color: var(--primary-color); outline: none; cursor: pointer;">
        </select>
      </div>

      <!-- Listing Status Badge (No background fill, no bullet point, colored text) -->
      <div>
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Status: </span>
        <span id="statusBadge" style="font-size: 0.78rem; font-weight: 700;">Loading...</span>
      </div>
    </div>

    <!-- Loading State Box -->
    <div id="loadingBox" style="text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.9rem;">
      Loading your business details...
    </div>

    <!-- Edit Form Card -->
    <div id="editCard" class="card" style="padding: 20px 16px; display: none;">
      <form id="editForm" style="display: flex; flex-direction: column; gap: 16px;">
        
        <!-- SECTION 1: Business Details -->
        <div>
          <h3 style="font-size: 0.95rem; font-weight: 700; color: var(--primary-color); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">
            1. Business Profile
          </h3>
          
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Business Name (Compulsory) *</label>
              <input type="text" id="bizName" required placeholder="e.g. Barakah Bakery SG" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none; background: #faf9f5;">
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Subtitle / Short Tagline (Compulsory) *</label>
              <input type="text" id="bizSub" required placeholder="e.g. Halal Artisan Sourdough & Pastries" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none; background: #faf9f5;">
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Category *</label>
              <select id="bizCategory" required style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none; background: #faf9f5; color: var(--text-main);">
                <option value="" disabled selected>Loading categories...</option>
              </select>
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Full Description (Compulsory) *</label>
              <textarea id="bizDesc" rows="3" required placeholder="Tell the community about your business story and offerings..." style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none; background: #faf9f5; resize: vertical;"></textarea>
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Banner Image URL <span style="font-weight: normal; color: var(--text-muted);">(Optional)</span></label>
              <input type="url" id="bizImage" placeholder="https://imgur.com/... or image link" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none; background: #faf9f5;">
            </div>
          </div>
        </div>

        <!-- SECTION 2: Contact & Social Info -->
        <div>
          <h3 style="font-size: 0.95rem; font-weight: 700; color: var(--primary-color); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">
            2. Contact & Social Media <span style="font-size: 0.75rem; font-weight: normal; color: var(--text-muted);">(Optional)</span>
          </h3>
          
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">WhatsApp Phone Number (with country code)</label>
              <input type="text" id="bizPhone" placeholder="658
