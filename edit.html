<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Business Listing - DailyBarakah SG</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Shimmer Loading Animation */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer-bg {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .shimmer-placeholder {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      color: transparent !important;
    }

    /* Muted Unselected Tabs */
    .tab-btn {
      opacity: 0.5;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="mobile-container" style="padding-bottom: 40px;">
    
    <!-- Top Nav -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <a href="/" style="font-size: 0.85rem; color: var(--primary-color); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
        ← Back to Directory
      </a>
      <button id="logoutBtn" style="background: transparent; border: none; font-size: 0.8rem; color: #dc2626; font-weight: 600; cursor: pointer; padding: 4px 8px;">
        Log Out
      </button>
    </div>

    <!-- Header Title & Polished Preview Engine -->
    <div style="text-align: center; margin-bottom: 12px;">
      <h2 style="color: var(--primary-color); font-size: 1.4rem; font-weight: 800; margin-bottom: 4px;">Vendor Dashboard</h2>
      <p style="color: var(--text-muted); font-size: 0.84rem; line-height: 1.4; margin-bottom: 12px;">
        Manage your business listing details, update Ummah deals, and edit contact links.
      </p>

      <!-- SELECT LISTING WITH SIGNATURE GREEN PILL DROPDOWN -->
      <div id="businessSelectorContainer" style="display: none; margin-bottom: 14px; align-items: center; justify-content: center; gap: 8px;">
        <span style="font-size: 0.76rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">
          Select Listing:
        </span>
        <select id="businessSelector" style="padding: 6px 14px; font-size: 0.82rem; font-weight: 700; border: 1.5px solid var(--primary-color); border-radius: 20px; background: #ffffff; color: var(--primary-color); outline: none; cursor: pointer;">
        </select>
      </div>

      <!-- LIVE PROFILE CARD PREVIEW (Swipeable + Shimmer Support) -->
      <div id="liveCardPreviewWrapper" style="margin-bottom: 14px; position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; flex-direction: column;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;">
          <!-- Left Arrow -->
          <button type="button" id="prevListingBtn" aria-label="Previous Listing" style="background: transparent; border: none; color: var(--primary-color); font-size: 1.5rem; font-weight: 800; cursor: pointer; padding: 0 4px; z-index: 2; display: none;">
            ‹
          </button>

          <!-- Profile Card Container (Swipeable Viewport) -->
          <div id="swipeableViewport" style="margin: 0; width: 100%; max-width: 290px; text-align: left; border: 1.5px solid var(--border-color); border-radius: var(--radius-md); padding: 10px; background: #faf9f5; box-shadow: var(--shadow-sm); overflow: hidden; touch-action: pan-y;">
            <div style="position: relative; margin-bottom: 6px;">
              <img id="previewCardBanner" src="" alt="Profile Banner" style="width: 100%; height: 130px; object-fit: cover; border-radius: var(--radius-sm); display: block;" class="shimmer-bg">
              <span id="previewFeaturedBadge" class="grid-featured-badge" style="display: none;" title="Featured Listing">★</span>
            </div>

            <!-- Business Name -->
            <h4 id="previewCardName" style="font-size: 0.95rem; font-weight: 800; color: transparent; text-align: center; margin-bottom: 6px; border-radius: 4px;" class="shimmer-bg">Loading...</h4>

            <!-- View Live Business Page -->
            <a id="previewViewLink" href="#" target="_blank" class="action-btn" style="display: none; text-decoration: none; text-align: center; font-size: 0.76rem; padding: 8px 0; margin-top: 4px;">
              View Live Business Page ↗
            </a>
          </div>

          <!-- Right Arrow -->
          <button type="button" id="nextListingBtn" aria-label="Next Listing" style="background: transparent; border: none; color: var(--primary-color); font-size: 1.5rem; font-weight: 800; cursor: pointer; padding: 0 4px; z-index: 2; display: none;">
            ›
          </button>
        </div>

        <!-- Swipe Indicator Pagination Dots -->
        <div id="swipePaginationDots" style="display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 6px;"></div>

        <!-- Status Badge -->
        <div style="text-align: center; margin-top: 4px;">
          <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600;">Status: </span>
          <span id="statusBadge" style="font-size: 0.76rem; font-weight: 700; color: var(--text-muted);">Loading...</span>
        </div>
      </div>
    </div>

    <!-- Edit Form Card with Clean Tabs & Shimmer Placeholder State -->
    <div id="editCard" class="card" style="padding: 16px;">
      
      <!-- Clean Tab Navigation Buttons -->
      <div style="display: flex; border-bottom: 1.5px solid var(--border-color); margin-bottom: 16px; gap: 4px;">
        <button type="button" class="tab-btn active" onclick="switchTab(1)" style="flex: 1; padding: 10px 4px; font-size: 0.78rem; font-weight: 700; background: transparent; border: none; border-bottom: 2.5px solid var(--primary-color); color: var(--primary-color); cursor: pointer; text-align: center;">1. Profile</button>
        <button type="button" class="tab-btn" onclick="switchTab(2)" style="flex: 1; padding: 10px 4px; font-size: 0.78rem; font-weight: 700; background: transparent; border: none; border-bottom: 2.5px solid transparent; color: var(--text-muted); cursor: pointer; text-align: center;">2. Contact</button>
        <button type="button" class="tab-btn" onclick="switchTab(3)" style="flex: 1; padding: 10px 4px; font-size: 0.78rem; font-weight: 700; background: transparent; border: none; border-bottom: 2.5px solid transparent; color: var(--text-muted); cursor: pointer; text-align: center;">3. Deals</button>
      </div>

      <!-- Swipeable Tab Content Container -->
      <div id="tabSwipeContainer" style="touch-action: pan-y;">
        <form id="editForm" style="display: flex; flex-direction: column; gap: 16px;">
          
          <!-- TAB 1: Business Profile -->
          <div id="tabContent1" class="tab-content" style="display: flex; flex-direction: column; gap: 12px;">
            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Business Name (Compulsory) *</label>
              <input type="text" id="bizName" required placeholder="e.g. Barakah Bakery SG" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Subtitle / Short Tagline (Compulsory) *</label>
              <input type="text" id="bizSub" required placeholder="e.g. Halal Artisan Sourdough & Pastries" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Category *</label>
              <select id="bizCategory" required class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
                <option value="" disabled selected>Loading categories...</option>
              </select>
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Full Description (Compulsory) *</label>
              <textarea id="bizDesc" rows="4" required placeholder="Tell the community about your business story and offerings..." class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none; resize: none; overflow: hidden; line-height: 1.4;" disabled></textarea>
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Banner Image URL <span style="font-weight: normal; color: var(--text-muted);">(Optional)</span></label>
              <input type="url" id="bizImage" placeholder="https://imgur.com/... or image link" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
            </div>

            <div style="margin-top: 8px;">
              <button type="submit" class="action-btn-primary save-btn" style="width: 100%; padding: 12px; opacity: 0.6;" disabled>Save Profile Changes</button>
            </div>
          </div>

          <!-- TAB 2: Contact & Social Media -->
          <div id="tabContent2" class="tab-content" style="display: none; flex-direction: column; gap: 12px;">
            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">WhatsApp Phone Number (with country code)</label>
              <input type="text" id="bizPhone" placeholder="6588469883" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
            </div>

            <div>
              <label id="bizWebsiteLabel" style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Website URL</label>
              <input type="url" id="bizWebsite" placeholder="https://yourbusiness.com" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Instagram URL</label>
              <input type="url" id="bizInstagram" placeholder="https://instagram.com/yourbusiness" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">TikTok URL</label>
              <input type="url" id="bizTiktok" placeholder="https://tiktok.com/@yourbusiness" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
            </div>

            <div style="margin-top: 8px;">
              <button type="submit" class="action-btn-primary save-btn" style="width: 100%; padding: 12px; opacity: 0.6;" disabled>Save Profile Changes</button>
            </div>
          </div>

          <!-- TAB 3: Exclusive Ummah Special Deal -->
          <div id="tabContent3" class="tab-content" style="display: none; flex-direction: column; gap: 12px;">
            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Deal Offer Text</label>
              <input type="text" id="bizDeal" placeholder="e.g. 10% OFF TOTAL BILL FOR FRIDAY WORSHIPPERS" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
            </div>

            <div>
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Redemption Type</label>
              <select id="bizActionType" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
                <option value="" disabled selected>Loading...</option>
              </select>
            </div>

            <div id="promoCodeGroup" style="display: none;">
              <label style="font-size: 0.78rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 4px;">Promo Code</label>
              <input type="text" id="bizPromoCode" placeholder="e.g. BARAKAH10" class="shimmer-placeholder" style="width: 100%; padding: 10px; font-size: 0.88rem; border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); outline: none;" disabled>
            </div>

            <div style="margin-top: 8px;">
              <button type="submit" class="action-btn-primary save-btn" style="width: 100%; padding: 12px; opacity: 0.6;" disabled>Save Profile Changes</button>
            </div>
          </div>

        </form>
      </div>

    </div>

  </div>

  <script>
    let recordId = null;
    let currentToken = null;
    let userBusinessesList = [];
    let currentListingIndex = 0;
    let activeTab = 1;

    // 1. Retrieve token from URL params or localStorage
    const urlParams = new URLSearchParams(window.location.search);
    currentToken = urlParams.get('token') || localStorage.getItem('db_vendor_token');

    if (!currentToken) {
      alert('No active edit session found. Please log in.');
      window.location.href = '/login.html';
    } else {
      localStorage.setItem('db_vendor_token', currentToken);
    }

    // Tab Switching Logic with Muted Unselected Tab Indicator
    function switchTab(tabNumber) {
      activeTab = tabNumber;
      document.querySelectorAll('.tab-content').forEach((el, idx) => {
        el.style.display = (idx + 1) === tabNumber ? 'flex' : 'none';
      });

      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        const isActive = (idx + 1) === tabNumber;
        btn.classList.toggle('active', isActive);
        btn.style.borderBottomColor = isActive ? 'var(--primary-color)' : 'transparent';
        btn.style.color = isActive ? 'var(--primary-color)' : 'var(--text-muted)';
      });
    }

    // Initialize Swipe Gestures for Switching Tabs
    function initTabSwipeGestures() {
      const container = document.getElementById('tabSwipeContainer');
      if (!container) return;

      let startX = 0;
      let startY = 0;
      let startTime = 0;

      container.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        startTime = Date.now();
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;
        const elapsedTime = Date.now() - startTime;

        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40 && elapsedTime < 400) {
          if (deltaX < 0) {
            // Swipe Left -> Next Tab
            if (activeTab < 3) switchTab(activeTab + 1);
          } else {
            // Swipe Right -> Previous Tab
            if (activeTab > 1) switchTab(activeTab - 1);
          }
        }
      }, { passive: true });
    }

    // Auto-expanding Full Description Textarea (starts at ~4 lines and expands smoothly)
    const descTextarea = document.getElementById('bizDesc');
    function autoResizeTextarea() {
      descTextarea.style.height = 'auto';
      descTextarea.style.height = (descTextarea.scrollHeight + 4) + 'px';
    }
    descTextarea.addEventListener('input', autoResizeTextarea);

    // Trigger Shimmering Placeholder during card updates/switching
    function setCardShimmerState(isShimmering) {
      const banner = document.getElementById('previewCardBanner');
      const name = document.getElementById('previewCardName');
      
      if (isShimmering) {
        banner.classList.add('shimmer-bg');
        banner.style.opacity = '0.5';
        name.classList.add('shimmer-bg');
        name.style.color = 'transparent';
      } else {
        banner.classList.remove('shimmer-bg');
        banner.style.opacity = '1';
        name.classList.remove('shimmer-bg');
        name.style.color = 'var(--primary-color)';
      }
    }

    // Update Live Profile Card Preview & Pagination Dots
    function updateLiveProfileCardPreview(biz) {
      const cardContainer = document.getElementById('liveCardPreviewWrapper');
      if (!cardContainer || !biz) return;

      setCardShimmerState(false);
      
      const banner = document.getElementById('previewCardBanner');
      const name = document.getElementById('previewCardName');
      const viewLink = document.getElementById('previewViewLink');
      const featuredBadge = document.getElementById('previewFeaturedBadge');

      banner.src = biz.imageUrl || 'https://lh3.googleusercontent.com/d/1MBk6pIwDCG0NH9bh9lD7EY9kAp4IQiNM';
      name.textContent = biz.name || 'Business Name';
      
      if (biz.slug) {
        viewLink.href = `/business.html?slug=${biz.slug}`;
        viewLink.style.display = 'block';
      } else {
        viewLink.style.display = 'none';
      }

      if (biz.isFeatured) {
        featuredBadge.style.display = 'inline-block';
      } else {
        featuredBadge.style.display = 'none';
      }

      renderPaginationDots();
    }

    // Render Swipe Pagination Dots
    function renderPaginationDots() {
      const dotsContainer = document.getElementById('swipePaginationDots');
      if (!dotsContainer) return;

      dotsContainer.innerHTML = '';
      if (userBusinessesList.length <= 1) {
        dotsContainer.style.display = 'none';
        return;
      }

      dotsContainer.style.display = 'flex';
      userBusinessesList.forEach((_, idx) => {
        const dot = document.createElement('span');
        const isActive = idx === currentListingIndex;
        dot.style.cssText = `
          width: ${isActive ? '16px' : '6px'};
          height: 6px;
          border-radius: 3px;
          background-color: ${isActive ? 'var(--primary-color)' : 'var(--border-color)'};
          transition: all 0.25s ease;
          display: inline-block;
          cursor: pointer;
        `;
        dot.onclick = () => switchActiveListing(idx);
        dotsContainer.appendChild(dot);
      });
    }

    // Switch active business by array index with shimmer effect
    function switchActiveListing(index) {
      if (!userBusinessesList || userBusinessesList.length === 0) return;
      
      if (index < 0) index = userBusinessesList.length - 1;
      if (index >= userBusinessesList.length) index = 0;

      currentListingIndex = index;
      const targetBiz = userBusinessesList[currentListingIndex];

      if (targetBiz && targetBiz.token !== currentToken) {
        setCardShimmerState(true);
        localStorage.setItem('db_vendor_token', targetBiz.token);
        window.location.href = `/edit.html?token=${targetBiz.token}`;
      }
    }

    // Render Dropdown Selector & Side Carousel Arrows
    function renderBusinessSelector(businesses) {
      const selectorContainer = document.getElementById('businessSelectorContainer');
      const businessSelector = document.getElementById('businessSelector');
      const prevBtn = document.getElementById('prevListingBtn');
      const nextBtn = document.getElementById('nextListingBtn');

      userBusinessesList = businesses || [];
      currentListingIndex = userBusinessesList.findIndex(b => b.token === currentToken);
      if (currentListingIndex === -1) currentListingIndex = 0;

      if (userBusinessesList.length > 0) {
        selectorContainer.style.display = 'flex';
        businessSelector.innerHTML = '';

        userBusinessesList.forEach((biz, idx) => {
          const option = document.createElement('option');
          option.value = biz.token;
          option.textContent = biz.name;
          if (idx === currentListingIndex) option.selected = true;
          businessSelector.appendChild(option);
        });

        businessSelector.onchange = (e) => {
          const newToken = e.target.value;
          setCardShimmerState(true);
          localStorage.setItem('db_vendor_token', newToken);
          window.location.href = `/edit.html?token=${newToken}`;
        };

        if (userBusinessesList.length > 1) {
          prevBtn.style.display = 'block';
          nextBtn.style.display = 'block';
          prevBtn.onclick = () => switchActiveListing(currentListingIndex - 1);
          nextBtn.onclick = () => switchActiveListing(currentListingIndex + 1);
        } else {
          prevBtn.style.display = 'none';
          nextBtn.style.display = 'none';
        }
      }
    }

    // Initialize Touch Swipe Gestures for the Preview Card
    function initCardSwipeGestures() {
      const viewport = document.getElementById('swipeableViewport');
      if (!viewport) return;

      let startX = 0;
      let startY = 0;
      let startTime = 0;

      viewport.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        startTime = Date.now();
      }, { passive: true });

      viewport.addEventListener('touchend', (e) => {
        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;
        const elapsedTime = Date.now() - startTime;

        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40 && elapsedTime < 400) {
          if (deltaX < 0) {
            switchActiveListing(currentListingIndex + 1);
          } else {
            switchActiveListing(currentListingIndex - 1);
          }
        }
      }, { passive: true });
    }

    // 3. Load Categories
    async function loadCategories(selectedCategory) {
      const categorySelect = document.getElementById('bizCategory');
      try {
        const response = await fetch('/api/businesses');
        let uniqueCategories = [];
        if (response.ok) {
          const businesses = await response.json();
          uniqueCategories = [...new Set(
            businesses.map(b => (b.Category || b.category || '').trim()).filter(Boolean)
          )];
        }

        if (selectedCategory && !uniqueCategories.includes(selectedCategory)) {
          uniqueCategories.push(selectedCategory);
        }

        uniqueCategories.sort((a, b) => {
          if (a.toLowerCase() === 'others') return 1;
          if (b.toLowerCase() === 'others') return -1;
          return a.localeCompare(b);
        });

        categorySelect.innerHTML = '<option value="" disabled>Select a category</option>';
        uniqueCategories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          if (cat === selectedCategory) opt.selected = true;
          categorySelect.appendChild(opt);
        });
      } catch (err) {
        categorySelect.innerHTML = `
          <option value="Food & Beverage">Food & Beverage</option>
          <option value="Retail & Fashion">Retail & Fashion</option>
          <option value="Services">Services</option>
          <option value="Others">Others</option>
        `;
        if (selectedCategory) categorySelect.value = selectedCategory;
      }
    }

    // 4. Dynamic ActionType & Promo URL Toggle Handler
    const actionTypeSelect = document.getElementById('bizActionType');
    const promoCodeGroup = document.getElementById('promoCodeGroup');
    const bizWebsiteInput = document.getElementById('bizWebsite');
    const bizWebsiteLabel = document.getElementById('bizWebsiteLabel');

    function updateActionTypeUI() {
      if (actionTypeSelect.value === 'code') {
        promoCodeGroup.style.display = 'block';
        bizWebsiteInput.setAttribute('required', 'true');
        bizWebsiteLabel.innerHTML = 'Website / Store URL * <span style="font-size: 0.72rem; color: #d97706; font-weight: normal;">(Required for promo code redirection)</span>';
      } else {
        promoCodeGroup.style.display = 'none';
        bizWebsiteInput.removeAttribute('required');
        bizWebsiteLabel.innerHTML = 'Website URL';
      }
    }

    actionTypeSelect.addEventListener('change', updateActionTypeUI);

    // Live Form Input Synchronizers
    document.getElementById('bizName').addEventListener('input', (e) => {
      const cardName = document.getElementById('previewCardName');
      if (cardName) cardName.textContent = e.target.value.trim() || 'Business Name';
    });

    document.getElementById('bizImage').addEventListener('input', (e) => {
      const cardBanner = document.getElementById('previewCardBanner');
      if (cardBanner) cardBanner.src = e.target.value.trim() || 'https://lh3.googleusercontent.com/d/1MBk6pIwDCG0NH9bh9lD7EY9kAp4IQiNM';
    });

    // Remove shimmering state & enable form fields once loaded
    function removeFormShimmer() {
      const fields = ['bizName', 'bizSub', 'bizCategory', 'bizDesc', 'bizImage', 'bizPhone', 'bizWebsite', 'bizInstagram', 'bizTiktok', 'bizDeal', 'bizActionType', 'bizPromoCode'];
      fields.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.classList.remove('shimmer-placeholder');
          el.style.color = 'var(--text-main)';
          el.disabled = false;
        }
      });
      document.querySelectorAll('.save-btn').forEach(btn => {
        btn.style.opacity = '1';
        btn.disabled = false;
      });
    }

    // 5. Load Business Data by Token & Persist Global Navigation Session
    async function loadBusinessDetails() {
      try {
        const response = await fetch(`/api/get-business?token=${encodeURIComponent(currentToken)}`);
        const data = await response.json();

        if (!response.ok || !data.recordId) {
          alert(data.error || 'Failed to load listing. Your edit link may be invalid.');
          localStorage.removeItem('db_vendor_token');
          localStorage.removeItem('vendorEmail');
          localStorage.removeItem('vendorSlug');
          window.location.href = '/login.html';
          return;
        }

        recordId = data.recordId;

        // SAVE SESSION FOR PROFILE ICON RING (script.js)
        if (data.ownerEmail) localStorage.setItem('vendorEmail', data.ownerEmail);
        if (data.slug) localStorage.setItem('vendorSlug', data.slug);

        // Render multi-listing dropdown & live profile card switcher
        renderBusinessSelector(data.allBusinesses);
        updateLiveProfileCardPreview(data);
        initCardSwipeGestures();
        initTabSwipeGestures();

        // Populate form fields
        document.getElementById('bizName').value = data.name || '';
        document.getElementById('bizSub').value = data.subtitle || '';
        document.getElementById('bizDesc').value = data.description || '';
        autoResizeTextarea(); // Dynamically resize textarea to fit loaded content perfectly
        
        document.getElementById('bizImage').value = data.imageUrl || '';
        document.getElementById('bizDeal').value = data.deal || '';

        // Map ActionType option safely
        let actionVal = (data.actionType || '').toLowerCase();
        if (actionVal === 'promocode' || actionVal === 'code') actionVal = 'code';
        else if (actionVal === 'claim') actionVal = 'claim';
        else actionVal = 'whatsapp';
        
        document.getElementById('bizPromoCode').value = data.promoCode || '';
        document.getElementById('bizPhone').value = data.phone || '';
        document.getElementById('bizWebsite').value = data.websiteUrl || '';
        document.getElementById('bizInstagram').value = data.instagramUrl || '';
        document.getElementById('bizTiktok').value = data.tiktokUrl || '';

        updateActionTypeUI();
        
        // Re-populate redemption options safely
        actionTypeSelect.innerHTML = `
          <option value="whatsapp">Enquire / Claim via WhatsApp</option>
          <option value="claim">In-Store Cashier PIN Redemption</option>
          <option value="code">Online Promo Code</option>
        `;
        if (actionVal) actionTypeSelect.value = actionVal;

        await loadCategories(data.category);
        removeFormShimmer();

        // Status Badge UI
        const statusBadge = document.getElementById('statusBadge');
        const statusVal = (data.status || 'Pending').toLowerCase();
        
        statusBadge.textContent = data.status || 'Pending Review';
        if (statusVal === 'active') {
          statusBadge.style.color = '#15803d'; // Green
        } else if (statusVal === 'rejected') {
          statusBadge.style.color = '#dc2626'; // Red
        } else {
          statusBadge.style.color = '#b45309'; // Amber/Pending
        }

      } catch (err) {
        alert('Error connecting to server.');
      }
    }

    // 6. Handle Save Submission
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveButtons = document.querySelectorAll('.save-btn');
      saveButtons.forEach(btn => {
        btn.textContent = 'Saving Changes...';
        btn.disabled = true;
      });

      const payload = {
        recordId: recordId,
        token: currentToken,
        name: document.getElementById('bizName').value,
        subtitle: document.getElementById('bizSub').value,
        category: document.getElementById('bizCategory').value,
        description: document.getElementById('bizDesc').value,
        deal: document.getElementById('bizDeal').value,
        actionType: document.getElementById('bizActionType').value,
        promoCode: document.getElementById('bizPromoCode').value,
        phone: document.getElementById('bizPhone').value,
        websiteUrl: document.getElementById('bizWebsite').value,
        instagramUrl: document.getElementById('bizInstagram').value,
        tiktokUrl: document.getElementById('bizTiktok').value,
        imageUrl: document.getElementById('bizImage').value
      };

      try {
        const response = await fetch('/api/update-business', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert('✓ Alhamdulillah! Your listing changes have been updated successfully.');
        } else {
          alert('Error: ' + (result.error || 'Failed to update profile.'));
        }
      } catch (err) {
        alert('Network error. Please try again later.');
      } finally {
        saveButtons.forEach(btn => {
          btn.textContent = 'Save Profile Changes';
          btn.disabled = false;
        });
      }
    });

    // Logout Button Handler
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to log out of your vendor portal?')) {
        localStorage.removeItem('db_vendor_token');
        localStorage.removeItem('vendorEmail');
        localStorage.removeItem('vendorSlug');
        window.location.href = '/login.html';
      }
    });

    // Run Initializations
    loadBusinessDetails();
    switchTab(1);
  </script>
</body>
</html>
